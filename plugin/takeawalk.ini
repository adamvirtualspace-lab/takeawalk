; Take a Walk settings. Copy this file next to takeawalk.dll in the game's
; bin\win_x64\plugins folder. Every setting is optional; these are the defaults.

[walk]
; Furthest you can walk from the truck, in metres. 0 = no limit.
max_distance=0

; Sway the view with each step.
head_bob=1

; Footstep sounds, and how loud they are (0 to 1). The recordings are the
; footstepNN.ogg files in the "takeawalk" folder next to the plugin.
footsteps=1
footstep_volume=0.2

; Hide the speedometer and the tutorial hints while on foot.
hide_hud=1

; Walk through the invisible walls behind the X symbols. They only exist to keep
; vehicles on the map; trucks are still stopped by them.
ignore_barriers=1

[debug]
; Log when and from where the game adds collision to its physics world.
; Only works on game version 1.61.1.1.
trace_collision=0

; Log every 5 seconds how many solid objects exist around the truck and the walker.
collision_census=0

; P while on foot shows and logs what solid object is straight ahead.
probe_key=0
